<!-- Contact Section -->
<section id="contact" class="max-w-3xl">
    <div class="flex items-center gap-2 mb-4">
      <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
      <span class="font-semibold text-green-600">Available Now</span>
    </div>
  
    <h2 class="text-2xl font-bold mb-6">📩 Contact</h2>
  
    <form
      id="contact-form"
      action="https://formspree.io/f/xdklyvoa"
      method="POST"
      class="space-y-4 bg-white dark:bg-gray-800 p-6 rounded-xl shadow-md"
    >
      <!-- Name -->
      <input
        type="text"
        name="name"
        placeholder="Your Name"
        required
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:border-gray-700 dark:text-gray-100"
      />
  
      <!-- Email -->
      <input
        type="email"
        name="email"
        placeholder="Your Email"
        required
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:border-gray-700 dark:text-gray-100"
      />
  
      <!-- Message -->
      <textarea
        name="message"
        rows="5"
        placeholder="Your Message"
        required
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:border-gray-700 dark:text-gray-100"
      ></textarea>
  
      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-indigo-700 transition-colors"
      >
        Send Message
      </button>
  
      <!-- Success & Error Messages -->
      <p id="form-success" class="hidden mt-4 text-green-600 dark:text-green-400 font-medium">
        ✅ Your message has been sent successfully!
      </p>
      <p id="form-error" class="hidden mt-4 text-red-600 dark:text-red-400 font-medium">
        ❌ There was a problem sending your message.
      </p>
    </form>
  </section>
  
  <script>
  const form = document.getElementById('contact-form');
  const successMsg = document.getElementById('form-success');
  const errorMsg = document.getElementById('form-error');
  
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(form);
  
    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: { 'Accept': 'application/json' }
      });
  
      if (response.ok) {
        successMsg.classList.remove('hidden');
        errorMsg.classList.add('hidden');
        form.reset();
      } else {
        successMsg.classList.add('hidden');
        errorMsg.classList.remove('hidden');
      }
    } catch (error) {
      successMsg.classList.add('hidden');
      errorMsg.classList.remove('hidden');
    }
  });
  </script>
